<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rimba Outdoor - Booking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --secondary:#7c3aed;
    --success:#16a34a;
    --warning:#f59e0b;
    --danger:#dc2626;
    --info:#0891b2;
    --dark:#111827;
    --dark2:#1f2937;
    --gray:#6b7280;
    --light:#f3f4f6;
    --white:#ffffff;
    --border:#e5e7eb;
    --sidebar:260px;
    --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:#f5f7fb;
    color:var(--dark);
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top left,#dbeafe,transparent 35%),
        radial-gradient(circle at bottom right,#ede9fe,transparent 35%),
        #f8fafc;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:38px;
}

.login-logo{
    width:65px;
    height:65px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
    margin:0 auto 20px;
}

.login-box h1{
    text-align:center;
    font-size:26px;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:var(--gray);
    margin-bottom:28px;
}

.login-info{
    margin-top:20px;
    padding:12px;
    background:#eff6ff;
    border-radius:10px;
    font-size:13px;
    color:#1e40af;
}

/* ================= APP ================= */

.app{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:var(--sidebar);
    background:linear-gradient(180deg,#111827,#172033);
    color:white;
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    z-index:100;
    overflow-y:auto;
}

.brand{
    height:75px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 22px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    font-size:20px;
}

.brand strong{
    font-size:18px;
}

.nav{
    padding:18px 12px;
}

.nav-title{
    font-size:11px;
    text-transform:uppercase;
    color:#94a3b8;
    padding:12px;
    letter-spacing:1px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:4px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.nav button:hover,
.nav button.active{
    background:#2563eb;
    color:white;
}

.logout-btn{
    position:absolute;
    bottom:18px;
    left:12px;
    right:12px;
}

.main{
    margin-left:var(--sidebar);
    width:calc(100% - var(--sidebar));
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:50;
}

.page-title{
    font-size:20px;
    font-weight:700;
}

.user-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.content{
    padding:28px;
}

/* ================= CUSTOMER ================= */

.customer-header{
    background:white;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.customer-brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
}

.customer-brand span{
    width:38px;
    height:38px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.customer-actions{
    display:flex;
    gap:8px;
}

.customer-content{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

/* ================= COMPONENT ================= */

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.03);
}

.card-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-body{
    padding:20px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    font-size:13px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-warning{
    background:var(--warning);
    color:white;
}

.btn-light{
    background:#f3f4f6;
    color:#374151;
}

.btn-info{
    background:var(--info);
    color:white;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:600;
    color:#374151;
}

.form-control{
    width:100%;
    padding:11px 13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:14px;
    background:white;
}

.form-control:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea.form-control{
    min-height:100px;
    resize:vertical;
}

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.grid-4{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

/* ================= STATS ================= */

.stat-card{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-icon{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.stat-number{
    font-size:26px;
    font-weight:800;
    margin-top:5px;
}

.stat-label{
    color:var(--gray);
    font-size:13px;
}

.blue{
    background:#dbeafe;
    color:#1d4ed8;
}

.green{
    background:#dcfce7;
    color:#15803d;
}

.orange{
    background:#fef3c7;
    color:#b45309;
}

.purple{
    background:#ede9fe;
    color:#6d28d9;
}

.red{
    background:#fee2e2;
    color:#b91c1c;
}

/* ================= TABLE ================= */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th{
    background:#f8fafc;
    color:#475569;
    font-weight:700;
    text-align:left;
    padding:13px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
}

tr:hover td{
    background:#fafafa;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.badge-success{
    background:#dcfce7;
    color:#166534;
}

.badge-warning{
    background:#fef3c7;
    color:#92400e;
}

.badge-danger{
    background:#fee2e2;
    color:#991b1b;
}

.badge-info{
    background:#cffafe;
    color:#155e75;
}

.badge-gray{
    background:#f3f4f6;
    color:#4b5563;
}

/* ================= PRODUCT ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
}

.product-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#f3f4f6;
}

.product-image-placeholder{
    width:100%;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#e5e7eb,#f9fafb);
    font-size:45px;
    color:#9ca3af;
}

.product-body{
    padding:16px;
}

.product-category{
    color:var(--primary);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
}

.product-name{
    font-size:16px;
    font-weight:700;
    margin:6px 0;
}

.product-price{
    font-size:18px;
    font-weight:800;
    color:var(--primary);
}

.product-stock{
    margin-top:8px;
    font-size:12px;
    color:var(--gray);
}

.product-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.product-actions .btn{
    flex:1;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 25px 60px rgba(0,0,0,.2);
}

.modal-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    font-size:18px;
}

.modal-close{
    border:0;
    background:#f3f4f6;
    width:32px;
    height:32px;
    border-radius:50%;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    padding:16px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* ================= CART ================= */

.cart-box{
    position:fixed;
    right:25px;
    bottom:25px;
    width:340px;
    background:white;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    border:1px solid var(--border);
    z-index:90;
}

.cart-header{
    padding:15px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
}

.cart-body{
    max-height:350px;
    overflow-y:auto;
    padding:10px;
}

.cart-item{
    display:flex;
    gap:10px;
    padding:10px;
    border-bottom:1px solid #f1f5f9;
}

.cart-item-image{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
    background:#f1f5f9;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:700;
    font-size:13px;
}

.qty-control{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:5px;
}

.qty-control button{
    border:0;
    width:24px;
    height:24px;
    border-radius:5px;
    background:#f1f5f9;
}

.cart-footer{
    padding:15px;
    border-top:1px solid var(--border);
}

.total-row{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    margin-bottom:12px;
}

/* ================= FILTER ================= */

.filter-box{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
}

.filter-actions{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

/* ================= TOAST ================= */

.toast-container{
    position:fixed;
    right:20px;
    top:90px;
    z-index:2000;
}

.toast{
    min-width:280px;
    padding:14px 16px;
    color:white;
    border-radius:10px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    animation:slideIn .25s ease;
    font-size:13px;
}

.toast.success{
    background:#16a34a;
}

.toast.error{
    background:#dc2626;
}

.toast.info{
    background:#2563eb;
}

@keyframes slideIn{
    from{
        transform:translateX(100%);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

/* ================= EMPTY ================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:var(--gray);
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* ================= RESPONSIVE ================= */

.mobile-menu{
    display:none;
    border:0;
    background:#f3f4f6;
    width:38px;
    height:38px;
    border-radius:8px;
}

@media(max-width:1000px){
    .grid-4{
        grid-template-columns:repeat(2,1fr);
    }

    .grid-3{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){
    :root{
        --sidebar:0px;
    }

    .sidebar{
        width:260px;
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 15px;
    }

    .content,
    .customer-content{
        padding:15px;
    }

    .grid-4,
    .grid-3,
    .grid-2{
        grid-template-columns:1fr;
    }

    .cart-box{
        left:15px;
        right:15px;
        bottom:15px;
        width:auto;
    }

    .customer-header{
        padding:0 15px;
    }

    .customer-brand{
        font-size:16px;
    }

    .customer-actions .btn span{
        display:none;
    }
}

@media(max-width:500px){
    .login-box{
        padding:25px 20px;
    }

    .product-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:16px;
    }

    .user-info .user-name{
        display:none;
    }
}



/* ================= QRIS PAYMENT ================= */
.qris-wrap{
    text-align:center;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    border:1px solid #dbeafe;
    border-radius:18px;
    padding:20px;
}
.qris-image{
    width:min(300px,100%);
    aspect-ratio:1/1;
    object-fit:contain;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:10px;
    margin:12px auto;
}
.payment-status-box{
    margin-top:15px;
    padding:12px 15px;
    border-radius:12px;
    background:#f8fafc;
}
.proof-image{
    max-width:220px;
    max-height:260px;
    object-fit:contain;
    border-radius:12px;
    border:1px solid #e5e7eb;
    background:#fff;
}

/* ================= PRINT ================= */

@media print{
    .sidebar,
    .topbar,
    .btn,
    .filter-box,
    .no-print{
        display:none!important;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .content{
        padding:0;
    }

    .card{
        box-shadow:none;
        border:0;
    }
}
</style>
</head>

<body>

<!-- ========================================================= -->
<!-- LOGIN USER -->
<!-- ========================================================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="login-logo">🛒</div>

        <h1>Rimba Outdoor</h1>
        <p>Booking Alat - Alat Tracking</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="loginUsername"
                    class="form-control"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button class="btn btn-primary" style="width:100%;">
                🔐 Login User
            </button>

        </form>

        <button
            class="btn btn-light"
            style="width:100%;margin-top:10px;"
            onclick="openCustomerMode()"
        >
            👤 Masuk sebagai Customer
        </button>

    </div>

</div>

<!-- ========================================================= -->
<!-- ADMIN APP -->
<!-- ========================================================= -->

<div id="adminApp" class="app hidden">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-icon">🛒</div>
            <strong>Rimba Outdoor</strong>
        </div>

        <nav class="nav">

            <div class="nav-title">Menu Utama</div>

            <button class="active" onclick="showAdminPage('dashboard',this)">
                📊 Dashboard
            </button>

            <button onclick="showAdminPage('catalog',this)">
                📦 Katalog
            </button>

            <button onclick="showAdminPage('booking',this)">
                📅 Booking
            </button>

            <button onclick="showAdminPage('transactions',this)">
                💳 Transaksi
            </button>

            <button onclick="showAdminPage('qris',this)">
                📲 Pembayaran QRIS
            </button>

            <div class="nav-title">Laporan</div>

            <button onclick="showAdminPage('rentalReport',this)">
                📈 Report Penyewaan
            </button>

            <button onclick="showAdminPage('stockReport',this)">
                📦 Report Stock
            </button>

        </nav>

        <button class="nav logout-btn" onclick="logout()">
            🚪 Logout
        </button>

    </aside>

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:12px;">
                <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
                <div class="page-title" id="adminPageTitle">
                    Dashboard
                </div>
            </div>

            <div class="user-info">
                <div class="avatar">A</div>
                <div class="user-name">
                    <strong>Administrator</strong>
                </div>
            </div>

        </header>

        <div class="content" id="adminContent"></div>

    </main>

</div>

<!-- ========================================================= -->
<!-- CUSTOMER APP -->
<!-- ========================================================= -->

<div id="customerApp" class="hidden">

    <header class="customer-header">

        <div class="customer-brand">
            <span>🛒</span>
            Rimba Outdoor
        </div>

        <div class="customer-actions">

            <button
                class="btn btn-light"
                onclick="customerGo('catalog')"
            >
                📦 <span>Katalog</span>
            </button>

            <button
                class="btn btn-light"
                onclick="customerGo('bookings')"
            >
                📅 <span>Booking</span>
            </button>

            <button
                class="btn btn-primary"
                onclick="openCustomerCart()"
            >
                🛒 <span>Keranjang</span>
                <b id="customerCartCount">0</b>
            </button>

        </div>

    </header>

    <main class="customer-content">

        <div id="customerContent"></div>

    </main>

</div>

<!-- ========================================================= -->
<!-- MODAL -->
<!-- ========================================================= -->

<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle">Modal</h3>

            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="modalBody" class="modal-body"></div>

        <div id="modalFooter" class="modal-footer"></div>

    </div>

</div>

<!-- ========================================================= -->
<!-- TOAST -->
<!-- ========================================================= -->

<div id="toastContainer" class="toast-container"></div>

<script>

/* =========================================================
   DATABASE LOCAL
========================================================= */

const DB_KEYS = {
    products: "rental_products_v1",
    categories: "rental_categories_v1",
    bookings: "rental_bookings_v1",
    transactions: "rental_transactions_v1",
    qris: "rental_qris_v1",
    session: "rental_session_v1"
};

let categories = JSON.parse(localStorage.getItem(DB_KEYS.categories) || "[]");

/* =========================================================
   HELPERS
========================================================= */

function generateId(prefix){

    return prefix +
        "-" +
        Date.now().toString(36).toUpperCase() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,7)
            .toUpperCase();

}

function formatCurrency(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(value || 0);

}

function formatDate(date){

    if(!date) return "-";

    return new Date(date).toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}

function formatDateTime(date){

    if(!date) return "-";

    return new Date(date).toLocaleString(
        "id-ID"
    );

}

function escapeHtml(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function showToast(message,type="success"){

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");

    toast.className =
        `toast ${type}`;

    toast.innerHTML = message;

    container.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3000);

}

function statusBadge(status){

    let cls="badge-gray";

    if(
        status==="Booking" ||
        status==="Diproses"
    ) cls="badge-info";

    if(status==="Disewa")
        cls="badge-warning";

    if(status==="Selesai")
        cls="badge-success";

    if(status==="Dibatalkan")
        cls="badge-danger";

    return `<span class="badge ${cls}">
        ${escapeHtml(status)}
    </span>`;

}

                    >

        </div>

    `).join("");

}

function filterAdminCatalog(){

    const search =
        (
            document.getElementById("catalogSearch")
            ?.value || ""
        ).toLowerCase();

    const category =
        document.getElementById("catalogCategory")
        ?.value || "";

    const status =
        document.getElementById("catalogStatus")
        ?.value || "";

    const filtered =
        products.filter(p=>{

            const matchSearch =
                p.name.toLowerCase().includes(search) ||
                p.code.toLowerCase().includes(search);

            const matchCategory =
                !category ||
                p.category===category;

            const matchStatus =
                !status ||
                p.status===status;

            return matchSearch &&
                   matchCategory &&
                   matchStatus;

        });

    document.getElementById("adminProductGrid")
        .innerHTML =
        adminProductCards(filtered);

}

function previewProductImage(e){

    const file =
        e.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = function(event){

        document.getElementById(
            "imagePreview"
        ).innerHTML = `

            <img
                src="${event.target.result}"
                style="
                    max-width:180px;
                    max-height:130px;
                    object-fit:cover;
                    border-radius:10px;
                "
            >

        `;

    };

    reader.readAsDataURL(file);

}

function saveProduct(){

    const id =
        document.getElementById("productId").value;

    const code =
        document.getElementById("productCode").value.trim();

    const name =
        document.getElementById("productName").value.trim();

    const category =
        document.getElementById("productCategory").value;

    const price =
        Number(
            document.getElementById("productPrice").value
        );

    const stock =
        Number(
            document.getElementById("productStock").value
        );

    const status =
        document.getElementById("productStatus").value;

    const description =
        document.getElementById("productDescription").value.trim();

    if(!code || !name || !category){

        showToast(
            "Lengkapi data barang",
            "error"
        );

        return;
    }

    const file =
        document.getElementById("productImage")
        .files[0];

    if(file){

        const reader =
            new FileReader();

        reader.onload = function(e){

            saveProductData(
                id,
                code,
                name,
                category,
                price,
                stock,
                status,
                description,
                e.target.result
            );

        };

        reader.readAsDataURL(file);

    }else{

        const old =
            products.find(p=>p.id===id);

        saveProductData(
            id,
            code,
            name,
            category,
            price,
            stock,
            status,
            description,
            old?.image || ""
        );

    }

}

function saveProductData(
    id,
    code,
    name,
    category,
    price,
    stock,
    status,
    description,
    image
){

    if(id){

        const index =
            products.findIndex(
                p=>p.id===id
            );

        if(index!==-1){

            products[index] = {
                ...products[index],
                code,
                name,
                category,
                price,
                stock,
                status,
                description,
                image
            };

        }

        showToast(
            "Barang berhasil diperbarui"
        );

    }else{

        products.push({

            id:generateId("PRD"),
            code,
            name,
            category,
            price,
            stock,
            status,
            description,
            image,
            createdAt:new Date().toISOString()

        });

        showToast(
            "Barang berhasil ditambahkan"
        );

    }

    saveProducts();

    closeModal();

    renderAdminCatalog();

}

function addCategory(){

    const input =
        document.getElementById(
            "newCategoryName"
        );

    const name =
        input.value.trim();

    if(!name){

        showToast(
            "Nama kategori harus diisi",
            "error"
        );

        return;
    }

    if(
        categories.some(
            c=>c.name.toLowerCase()===name.toLowerCase()
        )
    ){

        showToast(
            "Kategori sudah ada",
            "error"
        );

        return;
    }

    categories.push({

        id:generateId("CAT"),
        name,
        description:""

    });

    saveCategories();

    showToast(
        "Kategori berhasil ditambahkan"
    );

    openCategoryManager();

}

function deleteCategory(id){

    const category =
        categories.find(c=>c.id===id);

    if(!category) return;

    const used =
        products.some(
            p=>p.category===category.name
        );

    if(used){

        showToast(
            "Kategori masih digunakan oleh barang",
            "error"
        );

        return;
    }

    if(
        !confirm(
            `Hapus kategori "${category.name}"?`
        )
    ) return;

    categories =
        categories.filter(
            c=>c.id!==id
        );

    saveCategories();

    openCategoryManager();

}

function saveBookingStatus(id){

    const b =
        bookings.find(x=>x.id===id);

    if(!b) return;

    const newStatus =
        document.getElementById(
            "newBookingStatus"
        ).value;

    const oldStatus =
        b.status;

    /*
       Jika dibatalkan, kembalikan stok.
       Jika sebelumnya dibatalkan lalu diaktifkan lagi,
       kurangi kembali stok.
    */

    if(
        newStatus==="Dibatalkan" &&
        oldStatus!=="Dibatalkan"
    ){

        b.items.forEach(item=>{

            const product =
                products.find(
                    p=>p.id===item.productId
                );

            if(product){
                product.stock =
                    Number(product.stock) +
                    Number(item.qty);
            }

        });

        saveProducts();

    }

    if(
        oldStatus==="Dibatalkan" &&
        newStatus!=="Dibatalkan"
    ){

        let available = true;

        b.items.forEach(item=>{

            const product =
                products.find(
                    p=>p.id===item.productId
                );

            if(
                !product ||
                Number(product.stock)<Number(item.qty)
            ){
                available=false;
            }

        });

        if(!available){

            showToast(
                "Stok tidak mencukupi untuk mengaktifkan booking",
                "error"
            );

            return;
        }

        b.items.forEach(item=>{

            const product =
                products.find(
                    p=>p.id===item.productId
                );

            product.stock -= Number(item.qty);

        });

        saveProducts();

    }

    b.status = newStatus;

    saveBookings();

    closeModal();

    renderAdminBooking();

    showToast(
        "Status booking berhasil diperbarui"
    );

}

function togglePayment(id){

    const t=transactions.find(x=>x.id===id);
    if(!t) return;

    t.paymentStatus=t.paymentStatus==="Lunas" ? "Belum Lunas" : "Lunas";

    const b=bookings.find(x=>x.id===t.bookingId);
    if(b) b.paymentStatus=t.paymentStatus;

    saveTransactions();
    saveBookings();
    filterTransactions();

    showToast("Status pembayaran diperbarui");
}

function verifyPayment(id){

    const t=transactions.find(x=>x.id===id);
    if(!t) return;

    t.paymentStatus="Lunas";
    t.paymentVerifiedAt=new Date().toISOString();

    const b=bookings.find(x=>x.id===t.bookingId);
    if(b){
        b.paymentStatus="Lunas";
        b.paymentVerifiedAt=t.paymentVerifiedAt;
    }

    saveTransactions();
    saveBookings();
    filterTransactions();

    showToast("Pembayaran berhasil diverifikasi","success");
}

function rejectPayment(id){

    const t=transactions.find(x=>x.id===id);
    if(!t) return;

    t.paymentStatus="Ditolak";

    const b=bookings.find(x=>x.id===t.bookingId);
    if(b) b.paymentStatus="Ditolak";

    saveTransactions();
    saveBookings();
    filterTransactions();

    showToast("Bukti pembayaran ditolak","info");
}

function saveQrisSettings(){

    const name=document.getElementById("qrisName").value.trim();
    const account=document.getElementById("qrisAccount").value.trim();
    const file=document.getElementById("qrisFile").files[0];

    qrisSettings.name=name || "Rimba Outdoor";
    qrisSettings.account=account || "QRIS";

    if(file){
        const reader=new FileReader();
        reader.onload=function(e){
            qrisSettings.image=e.target.result;
            saveQris();
            renderQrisSettings();
            showToast("QRIS berhasil disimpan","success");
        };
        reader.readAsDataURL(file);
    }else{
        saveQris();
        renderQrisSettings();
        showToast("Pengaturan QRIS berhasil disimpan","success");
    }
}

function removeQris(){
    if(!confirm("Hapus QRIS?")) return;
    qrisSettings.image="";
    saveQris();
    renderQrisSettings();
    showToast("QRIS dihapus","info");
}

function exportRentalReport(){

                (!end || b.startDate<=end) &&

function addToCart(productId){

    const product =
        products.find(
            p=>p.id===productId
        );

    if(!product) return;

    if(Number(product.stock)<=0){

        showToast(
            "Stok barang habis",
            "error"
        );

        return;

    }

    const existing =
        customerCart.find(
            x=>x.productId===productId
        );

    if(existing){

        if(
            existing.qty <
            Number(product.stock)
        ){

            existing.qty++;

        }else{

            showToast(
                "Jumlah melebihi stok tersedia",
                "error"
            );

            return;

        }

    }else{

        customerCart.push({

            productId,
            qty:1

        });

    }

    updateCartCount();

    showToast(
        `${product.name} ditambahkan ke booking`
    );

}

function updateCartCount(){

    const count =
        customerCart.reduce(
            (sum,i)=>sum+i.qty,
            0
        );

    const el =
        document.getElementById(
            "customerCartCount"
        );

    if(el){
        el.textContent = count;
    }

}

    document.getElementById("modalTitle").textContent =

function customerCartHTML(){

        return `

    let total = 0;

    const html =
        customerCart.map(item=>{

            const p =
                products.find(
                    x=>x.id===item.productId
                );

            if(!p) return "";

            const subtotal =
                Number(p.price) *
                Number(item.qty);

            total += subtotal;

            return `

                <div class="cart-item">

                    ${
                        p.image
                        ?
                        `<img
                            src="${p.image}"
                            class="cart-item-image"
                        >`
                        :

                            style="

                        </div>

                            color:#64748b;
                        ">

                        </div>

                        <div class="qty-control">

                            >

                            </strong>

                            <button
                                onclick="changeCartQty('${p.id}',1)"
                            >
                                +
                            </button>

                                style="

                                    color:#dc2626;
                                "

        }).join("");

    return `

        <div style="
            display:flex;
            justify-content:space-between;
            margin-top:15px;
            padding-top:15px;
            border-top:1px solid #e5e7eb;
        ">

            <strong>Total</strong>

            <strong style="
                color:#2563eb;
            ">
                ${formatCurrency(total)}
            </strong>

        </div>

    `;

}

function changeCartQty(productId,delta){

    const item =
        customerCart.find(
            x=>x.productId===productId
        );

    const product =
        products.find(
            x=>x.id===productId
        );

    if(!item || !product) return;

    item.qty += delta;

    if(item.qty<=0){

        customerCart =
            customerCart.filter(
                x=>x.productId!==productId
            );

    }

    if(item.qty>Number(product.stock)){

        item.qty=Number(product.stock);

        showToast(
            "Jumlah melebihi stok",
            "error"
        );

    }

    updateCartCount();

    openCustomerCart();

}

function removeCartItem(productId){

    customerCart =
        customerCart.filter(
            x=>x.productId!==productId
        );

    updateCartCount();

    openCustomerCart();

}

function calculateRentalDays(startDate,endDate){

    if(!startDate || !endDate) return 0;

    const start = new Date(startDate + "T00:00:00");
    const end = new Date(endDate + "T00:00:00");
    const diff = end.getTime() - start.getTime();

    return Math.round(diff / (1000 * 60 * 60 * 24));

}

function updateCustomerRentalSummary(){

    const start = document.getElementById("customerStartDate")?.value || "";
    const end = document.getElementById("customerEndDate")?.value || "";
    const days = calculateRentalDays(start,end);
    const durationEl = document.getElementById("customerRentalDuration");
    const totalEl = document.getElementById("customerRentalTotal");
    const itemsEl = document.getElementById("customerRentalItems");

    if(durationEl){
        durationEl.textContent = days > 0 ? `${days} hari` : "-";
    }

    if(itemsEl){
        itemsEl.innerHTML = customerCart.map(item=>{
            const p = products.find(x=>x.id===item.productId);
            if(!p) return "";
            const subtotal = Number(p.price) * Number(item.qty) * Math.max(days,1);
            return `
                <div style="display:flex;justify-content:space-between;padding:7px 0;">
                    <span>${escapeHtml(p.name)} × ${item.qty} × ${days > 0 ? days : 1} hari</span>
                    <strong>${formatCurrency(subtotal)}</strong>
                </div>
            `;
        }).join("");
    }

    if(totalEl){
        const total = days > 0 ? cartTotal(days) : cartTotal(1);
        totalEl.textContent = formatCurrency(total);
    }
}

function cartTotal(days=1){

    const rentalDays = Math.max(Number(days) || 1, 1);

    return customerCart.reduce(
        (sum,item)=>{

            const p = products.find(x=>x.id===item.productId);

            return sum + (
                Number(p?.price || 0) *
                Number(item.qty) *
                rentalDays
            );

        },
        0
    );

}

function submitBooking(){

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();

    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();

    const startDate =
        document.getElementById(
            "customerStartDate"
        ).value;

    const endDate =
        document.getElementById(
            "customerEndDate"
        ).value;

    const note =
        document.getElementById(
            "customerNote"
        ).value.trim();

    if(
        !name ||
        !phone ||
        !startDate ||
        !endDate
    ){

        showToast(
            "Lengkapi data booking",
            "error"
        );

        return;

    }

    if(endDate<=startDate){

        showToast(
            "Tanggal kembali tidak boleh sebelum tanggal sewa",
            "error"
        );

        return;

    }

    const rentalDays = calculateRentalDays(startDate,endDate);

    if(rentalDays <= 0){
        showToast("Durasi sewa harus minimal 1 hari", "error");
        return;
    }

    /*
       Validasi stok sekali lagi
       sebelum transaksi dibuat.
    */

    for(const item of customerCart){

        const p =
            products.find(
                x=>x.id===item.productId
            );

        if(
            !p ||
            Number(p.stock) <
            Number(item.qty)
        ){

            showToast(
                `Stok ${p?.name || "barang"} tidak mencukupi`,
                "error"
            );

            return;

        }

    }

    const bookingId =
        generateBookingNumber();

    const items =
        customerCart.map(item=>{

            const p =
                products.find(
                    x=>x.id===item.productId
                );

            return {

                productId:p.id,
                code:p.code,
                name:p.name,
                qty:Number(item.qty),
                price:Number(p.price),
                subtotal:
                    Number(p.price) *
                    Number(item.qty) *
                    rentalDays

            };

        });

    const total =
        items.reduce(
            (sum,i)=>
                sum+i.subtotal,
            0
        );

    /*
       Kurangi stok
    */

    items.forEach(item=>{

        const p =
            products.find(
                x=>x.id===item.productId
            );

        p.stock -= item.qty;

    });

    const booking = {

        id:bookingId,
        customerName:name,
        phone:phone,
        startDate,
        endDate,
        rentalDays,
        note,
        items,
        total,
        status:"Booking",
        createdAt:new Date().toISOString()

    };

    bookings.push(booking);

    const transaction = {

        id:generateId("TRX"),
        bookingId,
        customerName:name,
        date:new Date().toISOString().split("T")[0],
        total,
        paymentStatus:"Belum Lunas",
        bookingStatus:"Booking",
        paymentProof:"",
        paymentSubmittedAt:"",
        paymentVerifiedAt:""

    };

    transactions.push(transaction);

    saveProducts();
    saveBookings();
    saveTransactions();

    customerCart=[];

    updateCartCount();

    closeModal();

    showBookingSuccess(booking);

}

function generateBookingNumber(){

    const date =
        new Date()
        .toISOString()
        .slice(0,10)
        .replaceAll("-","");

    const count =
        bookings.length+1;

    return `BK-${date}-${String(count).padStart(3,"0")}`;

}

function previewPaymentProof(e){
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=function(ev){
        document.getElementById("paymentProofPreview").innerHTML=`
            <img src="${ev.target.result}" class="proof-image" alt="Preview bukti pembayaran">
        `;
    };
    reader.readAsDataURL(file);
}

function submitPaymentProof(bookingId){

    const file=document.getElementById("paymentProofFile")?.files[0];

    if(!file){
        showToast("Silakan upload bukti pembayaran terlebih dahulu","error");
        return;
    }

    const booking=bookings.find(b=>b.id===bookingId);
    const transaction=transactions.find(t=>t.bookingId===bookingId);

    if(!booking || !transaction){
        showToast("Data booking tidak ditemukan","error");
        return;
    }

    const reader=new FileReader();

    reader.onload=function(e){
        transaction.paymentProof=e.target.result;
        transaction.paymentSubmittedAt=new Date().toISOString();
        transaction.paymentStatus="Menunggu Verifikasi";

        booking.paymentStatus="Menunggu Verifikasi";
        booking.paymentProof=e.target.result;
        booking.paymentSubmittedAt=transaction.paymentSubmittedAt;

        saveBookings();
        saveTransactions();

        closeModal();
        showToast("Bukti pembayaran berhasil dikirim. Menunggu verifikasi admin.","success");
        customerGo("bookings");
    };

    reader.readAsDataURL(file);
}

    if(!booking) return;

    showBookingSuccess(booking);
}

        Number(
            document.getElementById(
                "manualQty"
            ).value
        );

    if(!productId || qty<=0){

        showToast(
            "Pilih barang dan qty",
            "error"
        );

        return;

    }

    const product =
        products.find(
            p=>p.id===productId
        );

    if(!product) return;

    if(qty>Number(product.stock)){

        showToast(
            "Qty melebihi stok",
            "error"
        );

        return;

    }

    const existing =
        customerCart.find(
            x=>x.productId===productId
        );

    if(existing){

        existing.qty += qty;

    }else{

        customerCart.push({
            productId,
            qty
        });

    }

    renderManualItems();
    updateManualRentalSummary();

}

function renderManualItems(){

    document.getElementById(
        "manualItems"
    ).innerHTML = `

        ${
            customerCart.length===0
            ?
            `<div class="empty">
                Belum ada barang
            </div>`
            :
            customerCart.map(item=>{

                const p =
                    products.find(
                        x=>x.id===item.productId
                    );

                return `

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        padding:10px;
                        background:#f8fafc;
                        margin-bottom:5px;
                        border-radius:8px;
                    ">

                        <span>
                            ${escapeHtml(p.name)}
                            ×${item.qty}
                        </span>

                        <strong>
                            ${formatCurrency(
                                p.price*item.qty*Math.max(calculateRentalDays(
                                    document.getElementById("manualStart")?.value || "",
                                    document.getElementById("manualEnd")?.value || ""
                                ),1)
                            )}
                        </strong>

                    </div>

                `;

            }).join("")
        }

    `;

}

function saveManualBooking(){

    const name =
        document.getElementById(
            "manualName"
        ).value.trim();

    const phone =
        document.getElementById(
            "manualPhone"
        ).value.trim();

    const start =
        document.getElementById(
            "manualStart"
        ).value;

    const end =
        document.getElementById(
            "manualEnd"
        ).value;

    if(
        !name ||
        !phone ||
        !start ||
        !end ||
        customerCart.length===0
    ){

        showToast(
            "Lengkapi seluruh data",
            "error"
        );

        return;

    }

    if(end<=start){

        showToast(
            "Tanggal tidak valid",
            "error"
        );

        return;

    }

    const rentalDays = calculateRentalDays(start,end);

    if(rentalDays <= 0){
        showToast("Durasi sewa harus minimal 1 hari", "error");
        return;
    }

    for(const item of customerCart){

        const p =
            products.find(
                x=>x.id===item.productId
            );

        if(
            !p ||
            p.stock<item.qty
        ){

            showToast(
                "Stok tidak mencukupi",
                "error"
            );

            return;

        }

    }

    const items =
        customerCart.map(item=>{

            const p =
                products.find(
                    x=>x.id===item.productId
                );

            return {

                productId:p.id,
                code:p.code,
                name:p.name,
                qty:item.qty,
                price:p.price,
                subtotal:
                    p.price*item.qty*rentalDays

            };

        });

    const total =
        items.reduce(
            (sum,i)=>sum+i.subtotal,
            0
        );

    items.forEach(item=>{

        const p =
            products.find(
                x=>x.id===item.productId
            );

        p.stock -= item.qty;

    });

    const bookingId =
        generateBookingNumber();

    bookings.push({

        id:bookingId,
        customerName:name,
        phone,
        startDate:start,
        endDate:end,
        rentalDays,
        note:"",
        items,
        total,
        status:"Booking",
        createdAt:new Date().toISOString()

    });

    transactions.push({

        id:generateId("TRX"),
        bookingId,
        customerName:name,
        date:new Date().toISOString().split("T")[0],
        total,
        paymentStatus:"Belum Lunas",
        bookingStatus:"Booking"

    });

    saveProducts();
    saveBookings();
    saveTransactions();

    customerCart=[];

    closeModal();

    showToast(
        `Booking ${bookingId} berhasil dibuat`
    );

    renderAdminBooking();

}

/* =========================================================
   CSV
========================================================= */

function csvSafe(value){

    const text =
        String(value ?? "");

    return `"${text.replaceAll('"','""')}"`;

}

function downloadCSV(content,filename){

    const blob =
        new Blob(
            [content],
            {
                type:"text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href=url;
    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    showToast(
        "File CSV berhasil dibuat"
    );

}
